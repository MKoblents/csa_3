name: parity
limit: 500
memory_size: 0x120
memory_mapped_io:
  0x80: [4]
  0x84: []
reports:
  - name: Result
    slice: last
    filter:
      - state
    view: |
      numio[0x80]: {io:0x80:dec}
      numio[0x84]: {io:0x84:dec}
    assert: |
      numio[0x80]: [] >>> []
      numio[0x84]: [] >>> [1]